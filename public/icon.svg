    <path d="M -110,-95 L -65,-95 L -65,-25 L -25,-25 L -25,-95 L 20,-95 L 20,95 L -25,95 L -25,20 L -65,20 L -65,95 L -110,95 Z" fill="#ffffff" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.4))"/>
    <!-- S letter -->
