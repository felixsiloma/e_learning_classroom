  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <!-- Blueprint Grid Accent Lines -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="rgba(56,189,248,0.18)" stroke-width="2" stroke-dasharray="8 8"/>
