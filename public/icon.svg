  </g>

  <!-- Studio Academy Banner Pill -->
  <rect x="136" y="380" width="240" height="42" rx="21" fill="#f59e0b"/>
  <text x="256" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="19" fill="#002147" text-anchor="middle" letter-spacing="3">ACADEMY</text>
