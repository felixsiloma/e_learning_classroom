    <script>
      // Gracefully handle Vite dev HMR WebSocket in cloud iframe environments where WebSocket is disabled
      (function() {
        if (typeof window !== 'undefined') {
          // Suppress unhandled WebSocket rejections from @vite/client
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            var text = (reason && (reason.message || reason.stack || String(reason))) || '';
            if (
              text.includes('WebSocket') ||
              text.includes('createWebSocketModuleRunnerTransport') ||
              text.includes('vite:ws') ||
              text.includes('vite-hmr')
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('error', function(event) {
            var text = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || '';
            if (
              text.includes('WebSocket') ||
              text.includes('createWebSocketModuleRunnerTransport') ||
              text.includes('vite:ws') ||
              text.includes('vite-hmr')
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          // Stub vite-hmr WebSocket so Vite module runner connects cleanly without throwing
          var NativeWS = window.WebSocket;
          if (NativeWS) {
            window.WebSocket = function(url, protocols) {
              var isViteHmr = (protocols === 'vite-hmr') || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')));
              if (isViteHmr) {
                var target = new EventTarget();
                var mockSocket = {
                  readyState: 1, // WebSocket.OPEN
                  OPEN: 1,
                  CONNECTING: 0,
                  CLOSING: 2,
                  CLOSED: 3,
                  url: url,
                  protocol: protocols || 'vite-hmr',
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  send: function() {},
                  close: function() {
                    mockSocket.readyState = 3;
                  },
                  addEventListener: target.addEventListener.bind(target),
                  removeEventListener: target.removeEventListener.bind(target),
                  dispatchEvent: target.dispatchEvent.bind(target),
                  onopen: null,
                  onmessage: null,
                  onerror: null,
                  onclose: null
                };
                setTimeout(function() {
                  var openEvt = new Event('open');
                  if (typeof mockSocket.onopen === 'function') mockSocket.onopen(openEvt);
                  mockSocket.dispatchEvent(openEvt);
                }, 10);
                return mockSocket;
              }
              return new NativeWS(url, protocols);
            };
            window.WebSocket.prototype = NativeWS.prototype;
          }
        }
      })();
    </script>
